name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  dotnet:
    name: .NET build, analyse & tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore Newrest.Pos.slnx
          dotnet tool restore

      - name: Format check
        run: dotnet format Newrest.Pos.slnx --verify-no-changes --no-restore

      - name: Build (warnings as errors, .NET analyzers)
        run: dotnet build Newrest.Pos.slnx --no-restore -c Release

      - name: Check that the EF model matches the migrations
        run: dotnet ef migrations has-pending-model-changes -p src/Newrest.Pos.Infrastructure -s src/Newrest.Pos.Infrastructure --no-build --configuration Release

      - name: Unit tests (with coverage)
        run: >
          dotnet test tests/Newrest.Pos.Domain.Tests --no-build --configuration Release
          --collect:"XPlat Code Coverage" --results-directory ./TestResults/unit
          --logger "trx;LogFileName=unit.trx"

      - name: Integration tests (SQL Server via Testcontainers)
        run: >
          dotnet test tests/Newrest.Pos.Infrastructure.IntegrationTests --no-build --configuration Release
          --results-directory ./TestResults/integration --logger "trx;LogFileName=integration.trx"

      - name: Coverage gate (Domain >= 80 % lines)
        run: python3 deploy/ci/coverage_gate.py ./TestResults/unit 0.80

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
