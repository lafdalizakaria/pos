# Example production deployment of the central server (behind a TLS reverse proxy / load balancer).
# SQL Server is a managed instance (Azure SQL / SQL Server HA), not a container. Secrets come from production.env
# (never committed; copy production.env.example) or better from the orchestrator's secret store / key vault.
#   docker compose -f deploy/docker/docker-compose.prod.yml --env-file production.env run --rm migrator   # before each release
#   docker compose -f deploy/docker/docker-compose.prod.yml --env-file production.env up -d api backoffice
services:
  api:
    image: ${REGISTRY:-newrest}/newrest-pos-api:${VERSION:-1.0.0}
    restart: unless-stopped
    env_file: production.env
    environment:
      Supervision__JobsEnabled: "true"   # exactly one API instance runs the supervision jobs
    volumes:
      - storage:/data/storage
    ports: ["8080:8080"]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      disable: true   # probes: GET /health/live and /health/ready from the load balancer / orchestrator

  backoffice:
    image: ${REGISTRY:-newrest}/newrest-pos-backoffice:${VERSION:-1.0.0}
    restart: unless-stopped
    env_file: production.env
    volumes:
      - storage:/data/storage
    ports: ["8081:8080"]
    read_only: true
    tmpfs: [/tmp]

  migrator:
    image: ${REGISTRY:-newrest}/newrest-pos-migrator:${VERSION:-1.0.0}
    profiles: [migrate]
    env_file: production.env
    environment:
      ConnectionStrings__PosDb: ${MIGRATOR_CONNECTION_STRING}   # pos_migrator account (DDL rights), not pos_api

volumes:
  storage:   # photos, models, archives: shared by both services (use a network/blob-backed volume with several hosts)
