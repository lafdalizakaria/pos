[project]
name = "newrest-pos-vision"
version = "0.4.0"
description = "Service local de reconnaissance des plateaux (Newrest POS)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "google-genai>=1.0",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3", "onnxruntime>=1.18"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.uv]
package = false
